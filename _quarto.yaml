project:
  type: website

  # Pages à rendre
  render:
    - index.qmd
    - explorations.qmd
    - presentation/presentation.qmd

  # Configuration du site
  output-dir: docs

website:
  title: "GRAAL - Graph-based Research with Agents for Automatic Labelling"
  description: "Classification automatique dans des nomenclatures statistiques par approche agentique"
  site-url: "https://InseeFrLab.github.io/GRAAL"

  # Barre de navigation
  navbar:
    left:
      - href: index.html
        text: Accueil
      - href: explorations.html
        text: Explorations
      - href: presentation.html
        text: Présentation

  # Pied de page
  page-footer:
    center: "Projet GRAAL - Insee SSP Lab"
    right: "2025"

# Configuration des pages
format:
  html:
    theme: cosmo
    css: presentation/background.css
    toc: true

# Configuration Quarto
execute:
  freeze: auto

# Extensions Quarto
extensions:
  - onyxia