# À déposer dans argocd-templates/ de codif-ape-cd, le dossier
# graal-match-verifier-review/ allant lui à la racine du même dépôt.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: graal-match-verifier-review
spec:
  project: default
  source:
    repoURL: https://github.com/InseeFrLab/codif-ape-cd.git
    targetRevision: main
    path: graal-match-verifier-review
  destination:
    server: https://kubernetes.default.svc
    namespace: projet-ape
  syncPolicy:
    automated:
      selfHeal: true
