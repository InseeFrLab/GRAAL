version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: graal-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
      - ./neo4j_conf:/var/lib/neo4j/conf
    networks:
      - graal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/db/neo4j/exec?query=RETURN%201"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  graal-network:
    driver: bridge
