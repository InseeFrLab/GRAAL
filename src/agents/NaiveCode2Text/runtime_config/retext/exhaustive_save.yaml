retext:
  max_iterations: 20
  discrimination_threshold: 0.7
  discrim_api_url: "https://labelguard.lab.sspcloud.fr"
  qdrant_collection: "original_cleaned"
  session_id: "exhaustive_15lpc_v7"

prompt:
  prompt_path: "system/retext/"

main:
  exhaustive_sampling: true
  n_random_codes: 1000
  n_labels_per_gen: 15

exhaustivity:
  min_prompts_per_code: 3
  n_spec_per_prompt: 10          # Number of includes/examples per prompt

random:
  includes:
    geom_prob: 0.3
    min: 1
    max: null                   # null = up to the max number of includes

  examples:
    geom_prob: 0.2
    min: 1
    max: null                   # null = up to the max number of includes

export:
  output_format: ".parquet"
  save_batch_size: 1000