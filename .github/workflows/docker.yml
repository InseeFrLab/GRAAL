# Construit et pousse sur Docker Hub l'image de l'app de revue MatchVerifier (cf.
# Dockerfile). Le déploiement Argo CD, qui pointe sur le tag `latest` de cette image,
# vit dans le dépôt GitOps codif-ape-cd (dossier graal-match-verifier-review/).
#
# Secrets attendus dans le dépôt : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (un access
# token Docker Hub avec la permission Read & Write sur l'espace de noms visé par
# IMAGE ci-dessous).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Ni la doc ni la présentation ne finissent dans l'image (cf. .dockerignore) :
    # les inclure ferait tourner un build de plusieurs minutes pour rien.
    paths-ignore:
      - "docs/**"
      - "presentation/**"
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE: meilametayebjee/graal-match-verifier-review

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` suit main, `sha-<court>` identifie chaque build : c'est ce tag-là
      # qu'on épingle dans le Deployment quand on veut figer la version que les
      # annotateurs utilisent pendant une campagne de revue.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
