name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Syntax check
        run: python -m compileall -q src tests

      # Unit tests are dependency-free (pure-Python metrics), so no `uv sync`
      # is needed; keep the CI fast until integration tests exist.
      - name: Unit tests
        run: pytest -q
